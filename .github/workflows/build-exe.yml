name: Build Windows exe

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# 授予 GITHUB_TOKEN 写权限,允许创建 Release 并上传 exe
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      # V0.5.0 起程序更名为"微博长文收集记录整理器",exe 名同步改为 weibo-collector-GUI
      # 注意:Windows runner 默认用 PowerShell,不能使用 cmd 的 ^ 续行符,
      # 故 pyinstaller 命令写成单行,并用 --add-data 打包 class_names.json
      # --hidden-import weibo_ai: weibo_ai 在 GUI 内为函数内懒导入,显式声明确保打包
      # 从 V0.3.0 起只发布 GUI 版本(不再打包 CLI)
      - name: Build GUI exe
        run: pyinstaller --noconfirm --onefile --windowed --name "weibo-collector-GUI" --add-data "class_names.json;." --collect-all selenium --hidden-import weibo_ai weibo_crawler_gui.py

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: weibo-collector-exe
          path: |
            dist/weibo-collector-GUI.exe

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          files: |
            dist/weibo-collector-GUI.exe

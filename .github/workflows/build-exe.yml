name: Build Windows exe

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build GUI exe
        run: |
          pyinstaller --noconfirm --onefile --windowed --name 微博爬虫GUI ^
            --add-data "class_names.json;." ^
            --collect-all selenium ^
            weibo_crawler_gui.py

      - name: Build CLI exe
        run: |
          pyinstaller --noconfirm --onefile --console --name 微博爬虫CLI ^
            --add-data "class_names.json;." ^
            --collect-all selenium ^
            weibo_crawler_cli.py

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: weibo-crawler-exe
          path: |
            dist/微博爬虫GUI.exe
            dist/微博爬虫CLI.exe

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/微博爬虫GUI.exe
            dist/微博爬虫CLI.exe

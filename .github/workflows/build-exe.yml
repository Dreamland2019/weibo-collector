name: Build Windows exe

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# 授予 GITHUB_TOKEN 写权限,允许创建 Release 并上传 exe
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      # 注意:Windows runner 默认用 PowerShell,不能使用 cmd 的 ^ 续行符,
      # 故每个 pyinstaller 命令写成单行,并用 --add-data 打包 class_names.json
      - name: Build GUI exe
        run: pyinstaller --noconfirm --onefile --windowed --name "weibo-md-exporter-GUI" --add-data "class_names.json;." --collect-all selenium weibo_crawler_gui.py

      - name: Build CLI exe
        run: pyinstaller --noconfirm --onefile --console --name "weibo-md-exporter-CLI" --add-data "class_names.json;." --collect-all selenium weibo_crawler_cli.py

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: weibo-crawler-exe
          path: |
            dist/weibo-md-exporter-GUI.exe
            dist/weibo-md-exporter-CLI.exe

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          files: |
            dist/weibo-md-exporter-GUI.exe
            dist/weibo-md-exporter-CLI.exe
